        <button class="faq-button" id="faq-button" aria-label="Open FAQ">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512">

        </button>

        <header class="app-header">
            <h1><i class='bx bxs-star header-icon'></i> TaskVibe</h1>
        </header>

        <main class="todo-container">
            <form id="new-task-form" class="task-form">
                <input type="text" id="new-task-input" placeholder="Add a new task..." aria-label="New task input" required>
                <input type="text" id="new-task-comment" placeholder="Add a comment (optional)..." aria-label="Task comment input">
                <div class="datetime-inputs">
                    <input type="date" id="new-task-date" aria-label="Task due date" min="2025-05-01">
                    <input type="time" id="new-task-time" aria-label="Task due time">
                </div>
                <button type="submit" class="add-task-btn" aria-label="Add new task">
                    <i class='bx bx-plus'></i> Add Task
                </button>
            </form>

            <div class="filter-controls">
                <button class="filter-btn active" data-filter="all" aria-label="Show all tasks">All</button>
                <button class="filter-btn" data-filter="active" aria-label="Show active tasks">Active</button>
                <button class="filter-btn" data-filter="completed" aria-label="Show completed tasks">Completed</button>
            </div>

            <section class="task-list-section">
                <h2>Tasks</h2>
                <ul id="task-list" class="task-list"></ul>
            </section>
        </main>

        <footer class="app-footer">
            <!-- Modified from Uiverse.io by muhammad_1180 -->
            <form id="email-form" class="max-w-xl mx-auto px-4 sm:px-0">
                <label class="block text-gray-500 dark:text-gray-400 text-sm font-medium mb-2">
                    Stay Updated with TaskVibe
                </label>
                <div class="relative">
                    <input
                        aria-label="Email subscription input"
                        placeholder="Enter your email for updates"
                        class="w-full px-4 py-3 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:focus:ring-blue-400 dark:focus:border-blue-400 transition-all duration-200 placeholder-gray-400 dark:placeholder-gray-500 text-gray-900 dark:text-gray-100 hover:border-gray-400 dark:hover:border-gray-500 shadow-sm"
                        name="subscriber-email"
                        type="email"
                        required
                    />
                    <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none">
                        <svg
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                            class="h-5 w-5 text-gray-400 dark:text-gray-500"
                        >
                            <path
                                d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"
                                stroke-width="2"
                                stroke-linejoin="round"
                                stroke-linecap="round"
                            ></path>
                        </svg>
                    </div>
                </div>
                <button type="submit" class="mt-2 w-full px-4 py-2 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-lg hover:from-indigo-600 hover:to-purple-700 transition-all duration-200">
                    Subscribe
                </button>
                <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">
                    We'll never share your email with others.
                </p>
            </form>
            <div class="footer-info">
                <h3><i class='bx bxs-star header-icon'></i> TaskVibe</h3>
                <p>Developed by <a href="https://www.instagram.com/manish.rajdoot/" target="_blank" rel="noopener">Manish Rajdoot</a></p>
                <p>© 2025 TaskVibe. All rights reserved.</p>
            </div>
            <button id="install-btn" class="install-btn" aria-label="Install TaskVibe" style="display: none;">
                <i class='bx bx-download'></i> Install TaskVibe
            </button>
        </footer>
    </div>
